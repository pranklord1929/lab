# Copie ce fichier sous le nom agent-room.conf dans ton projet, puis adapte les
# quatre blocs. Aucune clé API ni aucun secret ne doit être placé ici.

ROOM_SESSION="my-agents"
ROOM_TITLE="MY CONTROL ROOM"
ROOM_ROOT="$CONFIG_DIR"
ROOM_HANDOFF_DIR="$ROOM_ROOT/.agent-context/handoffs"
ROOM_SIDEBAR_WIDTH=34
ROOM_MEMORY_HISTORY_LIMIT=4
ROOM_MEMORY_HEARTBEAT_SECONDS=900
ROOM_MEMORY_WORKING_FRESH_SECONDS=1800
ROOM_MEMORY_IDLE_FRESH_SECONDS=86400
# macOS: display a click-through cyan arrow over the pane currently hovered by a Finder drag.
ROOM_DROP_HOVER=1
# Optional read-only OVHcloud billing telemetry. Keep the three API secrets in
# the launcher environment, never in this file.
OVH_CLOUD_PROJECT=""
OVH_API_ENDPOINT="https://eu.api.ovh.com/1.0"
OVH_USAGE_REFRESH_SECONDS=3600
# Set to 0 once each agent points to a distinct Git worktree.
ROOM_ALLOW_SHARED_WORKSPACES=1

# Thème clair par défaut. Remplacer par « red-sands » pour la palette alternative.
ROOM_THEME="light"
ROOM_BG="#7A251E"
ROOM_FG="#D7C9A7"
ROOM_BOLD="#DFBD22"
ROOM_DARK="#3D1916"
ROOM_ACCENT="#FFFFFF"

AGENT_1_SLOT="agent-1"
AGENT_1_NAME="FRONT-1"
AGENT_1_ROLE="ROLE-A"
AGENT_1_DIR="$ROOM_ROOT"
AGENT_1_PROVIDER="anthropic"
AGENT_1_ANTHROPIC_COMMAND="bash"
AGENT_1_OPENAI_COMMAND="bash"
AGENT_1_LOCAL_COMMAND=""
# Comma-separated choices shown by the model menu. "default" always remains
# available and starts the CLI without a --model override.
AGENT_1_ANTHROPIC_MODELS=""
AGENT_1_OPENAI_MODELS=""
AGENT_1_COLOR="colour141"

AGENT_2_SLOT="agent-2"
AGENT_2_NAME="FRONT-2"
AGENT_2_ROLE="ROLE-B"
AGENT_2_DIR="$ROOM_ROOT"
AGENT_2_PROVIDER="anthropic"
AGENT_2_ANTHROPIC_COMMAND="bash"
AGENT_2_OPENAI_COMMAND="bash"
AGENT_2_LOCAL_COMMAND=""
AGENT_2_ANTHROPIC_MODELS=""
AGENT_2_OPENAI_MODELS=""
AGENT_2_COLOR="colour117"

AGENT_3_SLOT="agent-3"
AGENT_3_NAME="PIPELINE-1"
AGENT_3_ROLE="ROLE-C"
AGENT_3_DIR="$ROOM_ROOT"
AGENT_3_PROVIDER="openai"
AGENT_3_ANTHROPIC_COMMAND="bash"
AGENT_3_OPENAI_COMMAND="bash"
AGENT_3_LOCAL_COMMAND=""
AGENT_3_ANTHROPIC_MODELS=""
AGENT_3_OPENAI_MODELS=""
AGENT_3_COLOR="colour150"

AGENT_4_SLOT="agent-4"
AGENT_4_NAME="CONTROL ROOM"
AGENT_4_ROLE="COORDINATION"
AGENT_4_DIR="$ROOM_ROOT"
AGENT_4_PROVIDER="openai"
AGENT_4_ANTHROPIC_COMMAND="bash"
AGENT_4_OPENAI_COMMAND="bash"
AGENT_4_LOCAL_COMMAND=""
AGENT_4_ANTHROPIC_MODELS=""
AGENT_4_OPENAI_MODELS=""
AGENT_4_COLOR="colour214"
